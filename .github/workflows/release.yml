name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Triggers when you push a tag starting with "v" (e.g., v1.0.0)

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build project
        shell: cmd
        run: call build.bat

      - name: Create Release Package (Zip)
        shell: powershell
        run: |
          Compress-Archive -Path "release\hvlauncher.exe", "release\hvlauncher.ini", "release\driver_amd", "release\driver_intel" -DestinationPath hypervisor-launcher.zip

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: hypervisor-launcher.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
