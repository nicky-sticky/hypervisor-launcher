[Target]
; Target executable (absolute, or relative to the launcher directory)
exe = target.exe

[Driver]
; Driver .sys paths (absolute, or relative to the launcher directory).
; When a key is omitted or empty, the bundled layout default is used.
amd_sys   = driver_amd\SimpleSvm.sys
intel_sys = driver_intel\hyperkd.sys

[Tools]
; kvc engine executable (absolute, or relative to the launcher directory).
; When the key is omitted or empty, the bundled layout default tools\kvc.exe is used.
kvc = tools\kvc.exe
